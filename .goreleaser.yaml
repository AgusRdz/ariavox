version: 2

project_name: ariavox

before:
  hooks:
    - go mod tidy

builds:
  - id: linux-windows
    main: ./cmd/ariavox
    binary: ariavox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "ariavox_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*
  - id: raw
    formats:
      - binary
    name_template: "ariavox-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    output: true

sboms:
  - artifacts: binary

snapshot:
  version_template: "{{ .Tag }}-dev"

changelog:
  use: github
  abbrev: 7
  sort: asc
  filters:
    exclude:
      - "^chore: update changelog"
      - "^fix: address PR"
      - "^fix: resolve merge conflict"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Documentation
      regexp: "^docs"
    - title: CI/CD
      regexp: "^ci"
    - title: Other
      regexp: ".*"

release:
  github:
    owner: AgusRdz
    name: ariavox
  draft: false
  prerelease: auto
  name_template: "ariavox {{.Tag}}"
  # macOS binaries are uploaded by the release job after goreleaser runs,
  # using softprops/action-gh-release (see release.yml).

