name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Validate semver tag
        run: |
          if ! echo "${{ github.ref_name }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '${{ github.ref_name }}' is not valid semver"
            exit 1
          fi

      - name: Run tests
        run: go test ./... -count=1 -race

  # ── Linux / Windows builds (CGO_ENABLED=0) ───────────────────────────────
  build-linux-windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Build Linux + Windows binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/ariavox-linux-amd64   ./cmd/ariavox
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/ariavox-linux-arm64   ./cmd/ariavox
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/ariavox-windows-amd64.exe ./cmd/ariavox

      - uses: actions/upload-artifact@v4
        with:
          name: bins-linux-windows
          path: bin/
          retention-days: 1

  # ── macOS builds with CGo (NSAccessibility / VoiceOver) ──────────────────
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Build macOS binaries (CGo enabled)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p bin
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/ariavox-darwin-amd64 ./cmd/ariavox
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/ariavox-darwin-arm64 ./cmd/ariavox

      - name: Create universal binary
        run: |
          lipo -create -output bin/ariavox-darwin-universal \
            bin/ariavox-darwin-amd64 \
            bin/ariavox-darwin-arm64
          lipo -info bin/ariavox-darwin-universal

      - uses: actions/upload-artifact@v4
        with:
          name: bins-macos
          path: bin/
          retention-days: 1

  # ── Release: merge artifacts, sign, attest, publish ──────────────────────
  release:
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          path: bin/
          merge-multiple: true

      - name: Generate checksums
        run: cd bin && sha256sum ariavox-* > checksums.txt && cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums with cosign (keyless)
        run: |
          cosign sign-blob \
            --yes \
            --bundle bin/checksums.txt.bundle \
            bin/checksums.txt

      - name: Generate release notes
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72  # v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72  # v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            bin/ariavox-linux-amd64
            bin/ariavox-linux-arm64
            bin/ariavox-darwin-amd64
            bin/ariavox-darwin-arm64
            bin/ariavox-darwin-universal
            bin/ariavox-windows-amd64.exe
            bin/checksums.txt
            bin/checksums.txt.bundle

      - name: Attest build provenance (SLSA3)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            bin/ariavox-linux-amd64
            bin/ariavox-linux-arm64
            bin/ariavox-darwin-amd64
            bin/ariavox-darwin-arm64
            bin/ariavox-darwin-universal
            bin/ariavox-windows-amd64.exe

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -z "${HOMEBREW_TAP_TOKEN}" ] && echo "HOMEBREW_TAP_TOKEN not set, skipping" && exit 0
          VERSION=${{ github.ref_name }}
          VER=${VERSION#v}
          SHA_UNIVERSAL=$(sha256sum bin/ariavox-darwin-universal | awk '{print $1}')
          SHA_LINUX_AMD64=$(sha256sum bin/ariavox-linux-amd64 | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum bin/ariavox-linux-arm64 | awk '{print $1}')
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/AgusRdz/homebrew-tap.git tap
          cat > tap/Formula/ariavox.rb << FORMULA
          class Ariavox < Formula
            desc "Accessible PTY wrapper for AI coding agents"
            homepage "https://github.com/AgusRdz/ariavox"
            version "${VER}"

            on_macos do
              url "https://github.com/AgusRdz/ariavox/releases/download/${VERSION}/ariavox-darwin-universal"
              sha256 "${SHA_UNIVERSAL}"
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/AgusRdz/ariavox/releases/download/${VERSION}/ariavox-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/AgusRdz/ariavox/releases/download/${VERSION}/ariavox-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              binary = Dir["ariavox-*"].first
              chmod 0755, binary
              bin.install binary => "ariavox"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ariavox version")
            end
          end
          FORMULA
          cd tap && \
          git config user.name "github-actions[bot]" && \
          git config user.email "github-actions[bot]@users.noreply.github.com" && \
          git add Formula/ariavox.rb && \
          git commit -m "ariavox ${VERSION}" && \
          git push
