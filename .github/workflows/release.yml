name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Validate semver tag
        run: |
          if ! echo "${{ github.ref_name }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '${{ github.ref_name }}' is not valid semver"
            exit 1
          fi

      - run: go test ./... -count=1 -race

  # ── macOS binaries (CGO_ENABLED=1 for NSAccessibility / VoiceOver) ───────
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Build + lipo macOS binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p bin
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/ariavox-darwin-amd64 ./cmd/ariavox
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/ariavox-darwin-arm64 ./cmd/ariavox
          lipo -create -output bin/ariavox-darwin-universal \
            bin/ariavox-darwin-amd64 bin/ariavox-darwin-arm64
          lipo -info bin/ariavox-darwin-universal

      - uses: actions/upload-artifact@v4
        with:
          name: bins-macos
          path: bin/
          retention-days: 1

  # ── GoReleaser — Linux/Windows build, sign, attest, publish ──────────────
  release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: bins-macos
          path: bin/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft (SBOM)
        uses: taiki-e/install-action@v2
        with:
          tool: syft

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Upload macOS binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/ariavox-darwin-amd64
            bin/ariavox-darwin-arm64
            bin/ariavox-darwin-universal

      - name: Attest build provenance (SLSA3)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ariavox_*_linux_*
            dist/ariavox_*_windows_*
            bin/ariavox-darwin-amd64
            bin/ariavox-darwin-arm64
            bin/ariavox-darwin-universal
